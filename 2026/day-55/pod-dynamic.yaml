apiVersion: v1
kind: Pod
metadata:
  name: pod-dynamic
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: busybox:latest
    command: ["sh", "-c", "echo dynamic-ok > /data/message.txt; cat /data/message.txt; sleep 3600"]
    volumeMounts:
    - name: dyn
      mountPath: /data
  volumes:
  - name: dyn
    persistentVolumeClaim:
      claimName: pvc-dynamic
