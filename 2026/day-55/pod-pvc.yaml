apiVersion: v1
kind: Pod
metadata:
  name: pvc-pod
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: busybox:latest
    command: ["sh", "-c", "echo \"write $(date -u +%FT%TZ) from $(hostname)\" >> /data/message.txt; cat /data/message.txt; sleep 3600"]
    volumeMounts:
    - name: persist
      mountPath: /data
  volumes:
  - name: persist
    persistentVolumeClaim:
      claimName: pvc-manual
